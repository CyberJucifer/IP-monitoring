name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'password' }}
          POSTGRES_DB: ip_monitoring_test
          POSTGRES_USER: ${{ secrets.DB_USER || 'postgres' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.0
        bundler-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y iputils-ping

    - name: Run RuboCop
      run: |
        bundle exec rubocop --parallel

    - name: Run RuboCop security checks
      run: |
        bundle exec rubocop --only Security

    - name: Run tests
      env:
        DATABASE_URL: postgres://${{ secrets.DB_USER || 'postgres' }}:${{ secrets.DB_PASSWORD || 'password' }}@localhost:5432/ip_monitoring_test
        RACK_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: ip_monitoring_test
        DB_USER: ${{ secrets.DB_USER || 'postgres' }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'password' }}
      run: |
        bundle exec rspec

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t ip-monitoring:latest .

    - name: Test Docker Compose
      run: |
        docker-compose up -d
        sleep 30
        curl -f http://localhost:4567/health || exit 1
        docker-compose down
