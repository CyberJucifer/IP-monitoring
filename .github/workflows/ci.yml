name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.0
        bundler-cache: true

    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Cache RuboCop
      uses: actions/cache@v3
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-

    - name: Run RuboCop
      run: |
        bundle exec rubocop --format json | tee rubocop-results.json

    - name: Parse RuboCop results
      if: always()
      run: |
        if [ -f rubocop-results.json ]; then
          jq -r '.files[] | select(.offenses | length > 0) | .offenses[] | "::error file=\(.location.path),line=\(.location.line),col=\(.location.column)::\(.message)"' rubocop-results.json
        fi

  security:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.0
        bundler-cache: true

    - name: Run RuboCop security checks
      run: |
        bundle exec rubocop --only Security --format simple

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'password' }}
          POSTGRES_DB: ip_monitoring_test
          POSTGRES_USER: ${{ secrets.DB_USER || 'postgres' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.0
        bundler-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y iputils-ping

    - name: Run tests
      env:
        DATABASE_URL: postgres://${{ secrets.DB_USER || 'postgres' }}:${{ secrets.DB_PASSWORD || 'password' }}@localhost:5432/ip_monitoring_test
        RACK_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: ip_monitoring_test
        DB_USER: ${{ secrets.DB_USER || 'postgres' }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'password' }}
      run: |
        bundle exec rspec

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, security, test]

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t ip-monitoring:latest .

    - name: Test Docker Compose
      run: |
        docker-compose up -d
        sleep 30
        curl -f http://localhost:4567/health || exit 1
        docker-compose down

  notify:
    runs-on: ubuntu-latest
    needs: [lint, security, test, docker-build]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.lint.result == 'success' && needs.security.result == 'success' && needs.test.result == 'success' && needs.docker-build.result == 'success'
      run: |
        echo "✅ All tests passed successfully!"
        
    - name: Notify failure
      if: needs.lint.result == 'failure' || needs.security.result == 'failure' || needs.test.result == 'failure' || needs.docker-build.result == 'failure'
      run: |
        echo "❌ Some tests failed. Check the logs for details."
